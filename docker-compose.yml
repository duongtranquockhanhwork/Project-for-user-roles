name: uni-records

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uni_records
      POSTGRES_USER: ${DBA_USER:?set DBA_USER in .env}
      POSTGRES_PASSWORD: ${DBA_PASSWORD:?set DBA_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init/00-create-roles.sh:/docker-entrypoint-initdb.d/00-create-roles.sh:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/20-seed-data.sql:ro
    # Bound to localhost only: the database is never exposed to the network.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d uni_records"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./source
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: uni_records
      DB_USER: uni_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
