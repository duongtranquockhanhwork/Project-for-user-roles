<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#fff"/>

  <!-- External entities -->
  <g>
    <rect x="15" y="40" width="150" height="230" rx="6" fill="#eef3fb" stroke="#1f4e8c"/>
    <text x="90" y="60" text-anchor="middle" font-weight="700">Users (browser)</text>
    <text x="90" y="88" text-anchor="middle">Student</text>
    <text x="90" y="112" text-anchor="middle">Lecturer</text>
    <text x="90" y="136" text-anchor="middle">Registrar</text>
    <text x="90" y="160" text-anchor="middle">Security Auditor</text>
    <text x="90" y="184" text-anchor="middle">System Administrator</text>
    <text x="90" y="215" text-anchor="middle" fill="#b42318">Untrusted input:</text>
    <text x="90" y="231" text-anchor="middle" fill="#b42318">forms, URLs, cookies</text>
    <text x="90" y="255" text-anchor="middle" fill="#666">(any user may be hostile)</text>
  </g>
  <g>
    <rect x="15" y="320" width="150" height="70" rx="6" fill="#fff4e5" stroke="#b54708"/>
    <text x="90" y="345" text-anchor="middle" font-weight="700">DBA / operator</text>
    <text x="90" y="365" text-anchor="middle">docker host, psql</text>
  </g>

  <!-- Trust boundary 1 -->
  <line x1="205" y1="20" x2="205" y2="300" stroke="#b42318" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="212" y="35" fill="#b42318" font-weight="700">TB1: HTTP(S) - browser / server</text>

  <!-- Web application -->
  <rect x="235" y="45" width="370" height="250" rx="8" fill="#f6f8fa" stroke="#333"/>
  <text x="420" y="66" text-anchor="middle" font-weight="700">Web application (Flask + gunicorn, container user appuser)</text>
  <g font-size="11.5">
    <rect x="250" y="80" width="165" height="40" rx="4" fill="#fff" stroke="#888"/>
    <text x="332" y="97" text-anchor="middle">1. Authentication</text>
    <text x="332" y="112" text-anchor="middle" fill="#555">Argon2id, lockout</text>
    <rect x="425" y="80" width="165" height="40" rx="4" fill="#fff" stroke="#888"/>
    <text x="507" y="97" text-anchor="middle">2. Session + CSRF check</text>
    <text x="507" y="112" text-anchor="middle" fill="#555">every request</text>
    <rect x="250" y="132" width="340" height="40" rx="4" fill="#e8f4ec" stroke="#127a3e"/>
    <text x="420" y="149" text-anchor="middle">3. Authorization: default deny, role permissions + scope</text>
    <text x="420" y="164" text-anchor="middle" fill="#555">(OWN / ASSIGNED / ALL), record-level checks</text>
    <rect x="250" y="184" width="165" height="40" rx="4" fill="#fff" stroke="#888"/>
    <text x="332" y="201" text-anchor="middle">4. Validation + handlers</text>
    <text x="332" y="216" text-anchor="middle" fill="#555">parameterized SQL</text>
    <rect x="425" y="184" width="165" height="40" rx="4" fill="#fff" stroke="#888"/>
    <text x="507" y="201" text-anchor="middle">5. Output encoding</text>
    <text x="507" y="216" text-anchor="middle" fill="#555">Jinja autoescape + CSP</text>
    <rect x="250" y="236" width="340" height="40" rx="4" fill="#fdf0f0" stroke="#b42318"/>
    <text x="420" y="253" text-anchor="middle">6. Audit logger (sanitised details, no secrets)</text>
    <text x="420" y="268" text-anchor="middle" fill="#555">success events in same transaction; denials in own transaction</text>
  </g>

  <!-- Trust boundary 2 -->
  <line x1="635" y1="20" x2="635" y2="410" stroke="#b42318" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="642" y="35" fill="#b42318" font-weight="700">TB2: app / database</text>
  <text x="642" y="50" fill="#b42318">(account uni_app, least privilege)</text>

  <!-- Database -->
  <rect x="660" y="65" width="225" height="330" rx="8" fill="#f6f8fa" stroke="#333"/>
  <text x="772" y="86" text-anchor="middle" font-weight="700">PostgreSQL 16</text>
  <text x="772" y="101" text-anchor="middle" fill="#555">port bound to 127.0.0.1</text>
  <g font-size="11.5">
    <rect x="675" y="115" width="195" height="52" rx="4" fill="#fff" stroke="#888"/>
    <text x="772" y="134" text-anchor="middle">D1 users, user_roles, sessions</text>
    <text x="772" y="150" text-anchor="middle" fill="#555">hashes only, token hashes only</text>
    <rect x="675" y="177" width="195" height="52" rx="4" fill="#fff" stroke="#888"/>
    <text x="772" y="196" text-anchor="middle">D2 students, courses,</text>
    <text x="772" y="212" text-anchor="middle">enrollments, grades (+ guard)</text>
    <rect x="675" y="239" width="195" height="52" rx="4" fill="#fff" stroke="#888"/>
    <text x="772" y="258" text-anchor="middle">D3 role_permissions,</text>
    <text x="772" y="274" text-anchor="middle">role_conflicts (read-only)</text>
    <rect x="675" y="301" width="195" height="52" rx="4" fill="#fdf0f0" stroke="#b42318"/>
    <text x="772" y="320" text-anchor="middle">D4 audit_logs</text>
    <text x="772" y="336" text-anchor="middle" fill="#555">append-only, SHA-256 chain</text>
  </g>

  <!-- Flows -->
  <line x1="165" y1="100" x2="248" y2="100" stroke="#333" marker-end="url(#a)"/>
  <text x="170" y="93" font-size="10.5">credentials</text>
  <line x1="165" y1="150" x2="248" y2="150" stroke="#333" marker-end="url(#a)"/>
  <text x="170" y="143" font-size="10.5">cookie + request</text>
  <line x1="248" y1="205" x2="165" y2="205" stroke="#333" marker-end="url(#a)"/>
  <text x="170" y="199" font-size="10.5">encoded HTML</text>
  <line x1="605" y1="140" x2="673" y2="140" stroke="#333" marker-end="url(#a)"/>
  <line x1="605" y1="200" x2="673" y2="200" stroke="#333" marker-end="url(#a)"/>
  <line x1="605" y1="262" x2="673" y2="262" stroke="#333" marker-end="url(#a)"/>
  <line x1="605" y1="275" x2="673" y2="325" stroke="#b42318" marker-end="url(#a)"/>
  <text x="608" y="312" font-size="10.5" fill="#b42318">INSERT only</text>
  <path d="M165,355 C380,395 560,395 673,370" fill="none" stroke="#b54708" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="250" y="420" fill="#b54708" font-size="10.5">TB3: privileged maintenance (superuser) - outside the application</text>
</svg>
